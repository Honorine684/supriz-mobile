name: supriz
description: "A new Flutter project."


publish_to: 'none' 

version: 1.0.0+18

environment:
  sdk: ^3.5.4


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.0.16
  flutter_swiper_view: ^1.1.8
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  provider: ^6.1.2
  device_preview: ^1.2.0
  http: any
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_local_notifications: ^18.0.1
  # velocity_x: ^4.2.1  # Removed - not needed for emotions app
  webview_flutter: ^4.10.0
  intl: ^0.20.2
  get: ^4.6.6
  intl_phone_field: ^3.2.0
  path_provider: ^2.1.5
  marquee: ^2.2.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  uuid: ^4.5.1
  timezone: ^0.9.4
  audioplayers: ^6.1.0
  shimmer: ^3.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  google_fonts: ^6.2.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto-Regular
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Roboto-Bold
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
